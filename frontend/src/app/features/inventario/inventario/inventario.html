<mat-tab-group animationDuration="100ms">

  <mat-tab label="Inventario">
    @if (vista() === 'lista') {
      <app-producto-list
        (nuevo)="abrirNuevo()"
        (editar)="abrirEdicion($event)">
      </app-producto-list>
    } @else {
      <app-producto-form
        [producto]="productoEnEdicion()"
        (guardado)="onGuardado()"
        (cancelado)="onCancelado()">
      </app-producto-form>
    }
  </mat-tab>

  <!-- Espacio para futuras tabs: alertas de stock, historial de movimientos, etc. -->

</mat-tab-group>
