<div style="padding: 2rem; max-width: 500px;">
  <h2>{{ producto ? 'Editar producto' : 'Nuevo producto' }}</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div>
      <label>Nombre*</label><br>
      <input type="text" formControlName="nombre" />
      @if (form.controls.nombre.invalid && form.controls.nombre.touched) {
        <p style="color:red;">El nombre es obligatorio (máx 150 caracteres).</p>
      }
    </div>

    <div>
      <label>Descripción</label><br>
      <textarea formControlName="descripcion"></textarea>
    </div>

    <div>
      <label>Cantidad*</label><br>
      <input type="number" formControlName="cantidad" />
    </div>

    <div>
      <label>Unidad de medida*</label><br>
      <input type="text" formControlName="unidadMedida" placeholder="kg, unidades, litros..." />
    </div>

    <div>
      <label>Precio unitario*</label><br>
      <input type="number" step="0.01" formControlName="precioUnitario" />
    </div>

    <div>
      <label>Stock mínimo</label><br>
      <input type="number" formControlName="stockMinimo" />
    </div>

    @if (errorGuardado) {
      <p style="color:red;">{{ errorGuardado }}</p>
    }

    <div style="margin-top: 1rem;">
      <button type="submit" [disabled]="guardando">{{ guardando ? 'Guardando...' : 'Guardar' }}</button>
      <button type="button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
