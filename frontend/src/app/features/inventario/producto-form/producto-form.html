<mat-card class="producto-form-card">
  <mat-card-header>
    <mat-card-title>{{ producto ? 'Editar producto' : 'Nuevo producto' }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="guardar()" class="producto-form">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" />
        @if (form.controls.nombre.invalid && form.controls.nombre.touched) {
          <mat-error>El nombre es obligatorio (máx 150 caracteres)</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descripción</mat-label>
        <textarea matInput formControlName="descripcion" rows="3"></textarea>
      </mat-form-field>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Cantidad</mat-label>
          <input matInput type="number" formControlName="cantidad" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Unidad de medida</mat-label>
          <input matInput formControlName="unidadMedida" placeholder="kg, unidades, litros..." />
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Precio unitario</mat-label>
          <input matInput type="number" step="0.01" formControlName="precioUnitario" />
          <span matTextPrefix>$&nbsp;</span>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Stock mínimo</mat-label>
          <input matInput type="number" formControlName="stockMinimo" />
        </mat-form-field>
      </div>

      @if (errorGuardado) {
        <p class="error-message">{{ errorGuardado }}</p>
      }

      <div class="form-actions">
        <button mat-stroked-button type="button" (click)="cancelar()">Cancelar</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="guardando">
          @if (guardando) {
            <mat-spinner diameter="20" style="display:inline-block; margin-right: 8px;"></mat-spinner>
          }
          {{ guardando ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>

    </form>
  </mat-card-content>
</mat-card>
